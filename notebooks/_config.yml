# Book settings
title: Nouman Memon
author: n03an's personal notes
description: Nouman's Personal dump of AI explorations and notes

execute:
  execute_notebooks: "off"

sphinx:
  config:
    html_theme: quantecon_book_theme
    html_theme_options:
      repository_url: https://github.com/jupyter-book/jupyter-book
      og_logo_url: https://n0-man.github.io/n03an.me/_static/logo.svg
      description: Nouman's Personal dump of AI explorations and notes
      keywords: Python, Machine Learning, GenAI, Evals, LLMs, Data Science, Agents, MIT, arxiv
      qetheme_code_style: False
      quantecon_project: False
      use_repository_button: False
    bibtex_reference_style: author_year
    pygments_style: friendly
    mathjax3_config:
      tex:
        macros:
          "Exp": "\\operatorname{Exp}"
          "Binomial": "\\operatorname{Binomial}"
          "Poisson": "\\operatorname{Poisson}"
          "BB": "\\mathbb{B}"
          "EE": "\\mathbb{E}"
          "PP": "\\mathbb{P}"
          "RR": "\\mathbb{R}"
          "NN": "\\mathbb{N}"
          "ZZ": "\\mathbb{Z}"
          "dD": "\\mathcal{D}"
          "fF": "\\mathcal{F}"
          "lL": "\\mathcal{L}"
          "linop": "\\mathcal{L}(\\mathbb{B})"
          "linopell": "\\mathcal{L}(\\ell_1)"

  extra_extensions:
    - sphinx_proof
    - sphinx_exercise
    - sphinx_tojupyter

latex:
  latex_engine: "xelatex"
  latex_documents:
    targetname: book.tex

bibtex_bibfiles:
  - references.bib

html:
  favicon: "_assest/favicon.ico"
  use_repository_button: false
