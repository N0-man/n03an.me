# Book settings
title: n03an.me
author: Nouman Memon
logo: asset/logo.svg
description: personal website

sphinx:
  config:
    html_theme: quantecon_book_theme
    html_theme_options:
      dark_logo: asset/logo_dark.svg
      header_organisation_url: https://n03an.me
      header_organisation: Nouman Memon
      html_title: n03an.me
      repository_url: https://github.com/N0-man/n03an.me
      twitter: n03an
      twitter_logo_url: asset/logo_dark.svg
      og_logo_url: asset/logo_dark.svg
      description: Personal website
      keywords: Python, Machine Learning, GenAI, Evals, LLMs, Data Science
      analytics:
        google_analytics_id: G-1234
    bibtex_reference_style: author_year
    mathjax3_config:
      tex:
        macros:
          "Exp": "\\operatorname{Exp}"
          "Binomial": "\\operatorname{Binomial}"
          "Poisson": "\\operatorname{Poisson}"
          "BB": "\\mathbb{B}"
          "EE": "\\mathbb{E}"
          "PP": "\\mathbb{P}"
          "RR": "\\mathbb{R}"
          "NN": "\\mathbb{N}"
          "ZZ": "\\mathbb{Z}"
          "dD": "\\mathcal{D}"
          "fF": "\\mathcal{F}"
          "lL": "\\mathcal{L}"
          "linop": "\\mathcal{L}(\\mathbb{B})"
          "linopell": "\\mathcal{L}(\\ell_1)"

  extra_extensions:
    - sphinx_proof
    - sphinx_exercise
    - sphinx_tojupyter

execute:
  execute_notebooks: cache

latex:
  latex_engine: "xelatex"
  latex_documents:
    targetname: book.tex

bibtex_bibfiles:
  - references.bib
